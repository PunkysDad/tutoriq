services:
  postgres:
    image: postgres:15
    container_name: tutoriq-postgres
    environment:
      POSTGRES_DB: tutoriq
      POSTGRES_USER: tutoriq
      POSTGRES_PASSWORD: tutoriq
    ports:
      - "5432:5432"
    volumes:
      - tutoriq-postgres-data:/var/lib/postgresql/data

volumes:
  tutoriq-postgres-data:
