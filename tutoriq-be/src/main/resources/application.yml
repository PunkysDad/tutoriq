server:
  port: 8080

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000

anthropic:
  api-key: ${ANTHROPIC_API_KEY}
  model:
    tutor: claude-sonnet-4-20250514
    summary: claude-haiku-4-5-20251001
